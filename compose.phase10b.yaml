name: civiclear-phase10b

services:
  fastapi:
    build:
      context: .
      dockerfile: ai-inference-server/Dockerfile
    image: civiclear-fastapi:phase10b-local
    environment:
      PORT: "8080"
      MAX_IMAGE_UPLOAD_BYTES: "5242880"
      FASTAPI_AUTH_MODE: none
    ports:
      - "127.0.0.1:9000:8080"
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 3

  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    image: civiclear-laravel:phase10b-local
    environment:
      APP_NAME: CIVICLEAR
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      LOG_CHANNEL: stderr
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      REPORT_AI_DISPATCHER: inline
      REPORT_PHOTO_STORAGE_DRIVER: local
      AI_INFERENCE_URL: http://fastapi:8080
      AI_INFERENCE_AUTH_MODE: none
      PORT: "8080"
    ports:
      - "127.0.0.1:8000:8080"
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
      - /var/www/html/storage:size=67108864,uid=33,gid=33,mode=0770
      - /var/www/html/bootstrap/cache:size=16777216,uid=33,gid=33,mode=0770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      fastapi:
        condition: service_healthy
