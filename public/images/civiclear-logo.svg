<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title description">
  <title id="title">CIVICLEAR logo</title>
  <desc id="description">A blue C surrounding a road, city bars, and green location marker.</desc>
  <defs>
    <linearGradient id="ring" x1="80" y1="80" x2="560" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123b91"/>
      <stop offset="0.55" stop-color="#087fd1"/>
      <stop offset="1" stop-color="#10a985"/>
    </linearGradient>
    <linearGradient id="letter" x1="175" y1="170" x2="470" y2="465" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123b91"/>
      <stop offset="1" stop-color="#0ba6db"/>
    </linearGradient>
    <linearGradient id="road" x1="235" y1="320" x2="450" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#364152"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071c4b" flood-opacity=".18"/>
    </filter>
  </defs>

  <circle cx="320" cy="320" r="286" fill="#fff" stroke="url(#ring)" stroke-width="18"/>
  <g filter="url(#shadow)">
    <path d="M433 197a166 166 0 1 0 13 231" fill="none" stroke="url(#letter)" stroke-width="68" stroke-linecap="square"/>

    <g>
      <rect x="246" y="279" width="27" height="76" rx="4" fill="#1769bd"/>
      <rect x="281" y="254" width="27" height="94" rx="4" fill="#16a34a"/>
      <rect x="316" y="229" width="27" height="112" rx="4" fill="#0e91d5"/>
      <rect x="351" y="266" width="27" height="72" rx="4" fill="#1769bd"/>
      <rect x="386" y="245" width="27" height="89" rx="4" fill="#0e91d5"/>
    </g>

    <path d="M221 374c64-32 131-46 213-43 13 23 24 48 33 75-76-7-145 3-209 31-15-20-27-41-37-63Z" fill="url(#road)"/>
    <path d="m285 382 34-7 20 7-34 8-20-8Zm71-15 31-4 18 8-31 5-18-9Zm-33 36 38-8 22 10-39 9-21-11Z" fill="#fff" opacity=".95"/>

    <path d="M438 214c-38 0-69 30-69 67 0 50 69 112 69 112s69-62 69-112c0-37-31-67-69-67Z" fill="#16a34a"/>
    <circle cx="438" cy="280" r="24" fill="#fff"/>
  </g>

  <text x="320" y="547" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="-3">
    <tspan fill="#123b91">CIVIC</tspan><tspan fill="#16a34a">LEAR</tspan>
  </text>
